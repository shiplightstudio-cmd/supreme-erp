name: supreme-erp

services:
  frontend:
    image: supreme-erp/frontend:local
    build:
      context: ./supreme-erp-fe
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "3000:80"

  storefront:
    image: supreme-erp/storefront:local
    build:
      context: ./supreme-erp-storefront
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "3001:80"

  accounting:
    image: supreme-erp/accounting:local
    build:
      context: ./supreme-erp-accounting
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "3002:80"

  backend:
    image: supreme-erp/backend:local
    build:
      context: ./supreme-erp-be
      dockerfile: Dockerfile
    env_file:
      - ./supreme-erp-be/.env
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      MYSQL_HOSTNAME: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-supreme_erp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-supreme_erp_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-supreme_erp}
    ports:
      - "5000:5000"

  mysql:
    image: mysql:9.7.2
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-supreme_erp}
      MYSQL_USER: ${MYSQL_USER:-supreme_erp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-supreme_erp_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-replace-with-a-long-random-root-password}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command: --log-bin-trust-function-creators=1

  # n8n:
  #   image: n8nio/n8n:2.40.7
